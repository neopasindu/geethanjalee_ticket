<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Ticket Scanner</title>
  <!-- Fast QR Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --success: #137333;
      --success-bg: #e6f4ea;
      --warning: #b06000;
      --warning-bg: #fef7e0;
      --error: #c5221f;
      --error-bg: #fce8e6;
      --surface: #ffffff;
      --bg: #f8f9fa;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--surface);
      padding: 16px 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(60,64,67,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-area h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-area span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .stats-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      box-shadow: 0 1px 3px rgba(60,64,67,0.08);
    }

    .stat-item .val {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-item .lbl {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .stat-item.checked .val { color: var(--success); }
    .stat-item.invalid .val { color: var(--error); }

    .scanner-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(60,64,67,0.1);
    }

    .card-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #f1f3f4;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    #reader-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #reader {
      width: 100%;
      max-width: 480px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .mode-switch-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f8f9fa;
      border-top: 1px solid var(--border);
    }

    .switch-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .manual-input-area {
      padding: 16px;
      display: flex;
      gap: 8px;
    }

    .manual-input-area input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .manual-input-area input:focus {
      border-color: var(--primary);
    }

    .manual-input-area button {
      padding: 12px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .manual-input-area button:hover {
      background: var(--primary-hover);
    }

    .result-card {
      display: none;
      border-radius: var(--radius);
      padding: 18px;
      animation: slideIn 0.2s ease-out;
      border: 1px solid transparent;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-card.success {
      background: var(--success-bg);
      border-color: #a8dab5;
      color: var(--success);
    }

    .result-card.warning {
      background: var(--warning-bg);
      border-color: #fdd663;
      color: var(--warning);
    }

    .result-card.error {
      background: var(--error-bg);
      border-color: #f6aea9;
      color: var(--error);
    }

    .result-header {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .result-details {
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0,0,0,0.06);
    }

    .camera-controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
    }

    .btn-sm:hover { background: #f1f3f4; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-area">
        <h1>🎟️ Secure Ticket Scanner</h1>
        <span id="event-tag">Google Sheets Connected</span>
      </div>
      <button class="btn-sm" onclick="loadStats()">🔄 Refresh</button>
    </header>

    <div class="stats-card">
      <div class="stat-item">
        <div class="val" id="stat-total">-</div>
        <div class="lbl">Total</div>
      </div>
      <div class="stat-item checked">
        <div class="val" id="stat-checked">-</div>
        <div class="lbl">Checked-In</div>
      </div>
      <div class="stat-item">
        <div class="val" id="stat-remaining">-</div>
        <div class="lbl">Remaining</div>
      </div>
      <div class="stat-item invalid">
        <div class="val" id="stat-invalid">-</div>
        <div class="lbl">Invalid</div>
      </div>
    </div>

    <div class="scanner-card">
      <div class="card-tabs">
        <button class="tab-btn active" id="tab-camera" onclick="switchInputMode('camera')">📷 Camera Scan</button>
        <button class="tab-btn" id="tab-manual" onclick="switchInputMode('manual')">⌨️ Barcode / Manual</button>
      </div>

      <!-- Live Camera Scanner View -->
      <div id="camera-section">
        <div id="reader-container">
          <div id="reader"></div>
          <div class="camera-controls">
            <button class="btn-sm" id="btn-toggle-camera" onclick="toggleCamera()">Pause Camera</button>
            <button class="btn-sm" onclick="switchCameraFacing()">Flip Camera</button>
          </div>
        </div>
      </div>

      <!-- Manual / Hardware Scanner View -->
      <div id="manual-section" style="display: none;">
        <div class="manual-input-area">
          <input type="text" id="manual-code" placeholder="Scan or enter code (e.g. TICKET-D-0001-A2B3C4D5)" autocomplete="off">
          <button onclick="handleManualSubmit()">Submit</button>
        </div>
      </div>

      <div class="mode-switch-bar">
        <span class="switch-label">
          <span id="mode-text">✅ Check-In Mode</span>
        </span>
        <div class="toggle-container">
          <span style="font-size: 12px; color: var(--muted);">Verify Only</span>
          <label class="switch">
            <input type="checkbox" id="checkin-toggle" checked onchange="onModeChange()">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Live Scan Result Card -->
    <div id="result-box" class="result-card">
      <div class="result-header" id="result-title"></div>
      <div class="result-details" id="result-details"></div>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let cameraRunning = false;
    let currentFacingMode = "environment";
    let isProcessing = false;
    let lastScannedText = "";
    let lastScanTime = 0;

    // Web Audio synthesizer for immediate sound feedback
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.1); // A5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'warning') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(370, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else { // error
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(164.81, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        }
      } catch (e) {
        console.warn("Audio feedback error:", e);
      }
    }

    function switchInputMode(mode) {
      document.getElementById('tab-camera').classList.toggle('active', mode === 'camera');
      document.getElementById('tab-manual').classList.toggle('active', mode === 'manual');
      document.getElementById('camera-section').style.display = (mode === 'camera') ? 'block' : 'none';
      document.getElementById('manual-section').style.display = (mode === 'manual') ? 'block' : 'none';

      if (mode === 'manual') {
        const inp = document.getElementById('manual-code');
        inp.focus();
      }
    }

    function onModeChange() {
      const isCheckIn = document.getElementById('checkin-toggle').checked;
      document.getElementById('mode-text').textContent = isCheckIn ? '✅ Check-In Mode' : '🔍 Verify Only Mode';
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };

      html5QrCode.start(
        { facingMode: currentFacingMode },
        config,
        onScanSuccess,
        (errorMessage) => { /* ignore per-frame scan misses */ }
      ).then(() => {
        cameraRunning = true;
        document.getElementById('btn-toggle-camera').textContent = 'Pause Camera';
      }).catch(err => {
        console.warn("Camera start failed:", err);
        document.getElementById('reader').innerHTML = '<div style="color:white;padding:24px;text-align:center;">Camera access not granted or unavailable.<br>Please use Barcode / Manual input.</div>';
      });
    }

    function toggleCamera() {
      if (!html5QrCode) return;
      if (cameraRunning) {
        html5QrCode.stop().then(() => {
          cameraRunning = false;
          document.getElementById('btn-toggle-camera').textContent = 'Resume Camera';
        });
      } else {
        startScanner();
      }
    }

    function switchCameraFacing() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      if (cameraRunning && html5QrCode) {
        html5QrCode.stop().then(() => {
          startScanner();
        });
      }
    }

    function onScanSuccess(decodedText) {
      const now = Date.now();
      // Debounce duplicate scans within 2.5 seconds
      if (decodedText === lastScannedText && (now - lastScanTime) < 2500) {
        return;
      }

      if (isProcessing) return;

      lastScannedText = decodedText;
      lastScanTime = now;
      processTicket(decodedText);
    }

    function handleManualSubmit() {
      const inp = document.getElementById('manual-code');
      const code = inp.value.trim();
      if (!code) return;
      processTicket(code);
      inp.value = '';
      inp.focus();
    }

    document.getElementById('manual-code').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        handleManualSubmit();
      }
    });

    function processTicket(code) {
      isProcessing = true;
      const isCheckIn = document.getElementById('checkin-toggle').checked;
      showLoadingResult();

      // Check if running inside Google Apps Script iframe
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        if (isCheckIn) {
          google.script.run
            .withSuccessHandler(onCheckInResponse)
            .withFailureHandler(onErrorResponse)
            .checkInTicket(code);
        } else {
          google.script.run
            .withSuccessHandler(onVerifyResponse)
            .withFailureHandler(onErrorResponse)
            .verifyTicket(code);
        }
      } else {
        // Fallback simulation for browser testing
        setTimeout(() => {
          onCheckInResponse({
            success: true,
            message: `Mock Check-In Success: ${code}`,
            ticketId: code.split('-').slice(0, 3).join('-'),
            ticketType: 'D'
          });
        }, 300);
      }
    }

    function showLoadingResult() {
      const box = document.getElementById('result-box');
      box.className = 'result-card';
      box.style.display = 'block';
      box.style.background = '#e8eaed';
      box.style.color = '#3c4043';
      document.getElementById('result-title').textContent = '⏳ Verifying ticket...';
      document.getElementById('result-details').textContent = 'Validating cryptographic signature with sheet database.';
    }

    function onCheckInResponse(res) {
      isProcessing = false;
      const box = document.getElementById('result-box');
      box.style.display = 'block';

      if (res.success) {
        playSound('success');
        box.className = 'result-card success';
        document.getElementById('result-title').textContent = '✅ Checked In Successfully';
        document.getElementById('result-details').innerHTML = `
          <div><strong>Ticket ID:</strong> ${res.ticketId} <span class="badge">Type ${res.ticketType || '-'}</span></div>
          <div>${res.message}</div>
        `;
        loadStats();
      } else if (res.alreadyCheckedIn) {
        playSound('warning');
        box.className = 'result-card warning';
        document.getElementById('result-title').textContent = '⚠️ Already Checked In';
        document.getElementById('result-details').innerHTML = `
          <div><strong>Ticket ID:</strong> ${res.ticketId}</div>
          <div>${res.message}</div>
        `;
      } else {
        playSound('error');
        box.className = 'result-card error';
        document.getElementById('result-title').textContent = '🚨 Check-In Rejected';
        document.getElementById('result-details').innerHTML = `
          <div>${res.message}</div>
          ${res.ticketId ? `<div><strong>Flagged Ticket:</strong> ${res.ticketId}</div>` : ''}
        `;
        loadStats();
      }
    }

    function onVerifyResponse(res) {
      isProcessing = false;
      const box = document.getElementById('result-box');
      box.style.display = 'block';

      if (res.valid) {
        const isChecked = res.status === 'Checked-In';
        if (isChecked) {
          playSound('warning');
          box.className = 'result-card warning';
          document.getElementById('result-title').textContent = 'ℹ️ Verified: Already Checked In';
        } else {
          playSound('success');
          box.className = 'result-card success';
          document.getElementById('result-title').textContent = '✅ Verified: Valid Ticket';
        }
        document.getElementById('result-details').innerHTML = `
          <div><strong>Ticket ID:</strong> ${res.ticketId} <span class="badge">Type ${res.ticketType}</span></div>
          <div><strong>Current Status:</strong> ${res.status}</div>
          ${res.checkInTime ? `<div><strong>Check-In Time:</strong> ${res.checkInTime}</div>` : ''}
        `;
      } else {
        playSound('error');
        box.className = 'result-card error';
        document.getElementById('result-title').textContent = '🚨 Verification Failed';
        document.getElementById('result-details').innerHTML = `
          <div>${res.message}</div>
        `;
      }
    }

    function onErrorResponse(err) {
      isProcessing = false;
      playSound('error');
      const box = document.getElementById('result-box');
      box.className = 'result-card error';
      box.style.display = 'block';
      document.getElementById('result-title').textContent = '❌ Server Error';
      document.getElementById('result-details').textContent = err.message || err.toString();
    }

    function loadStats() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(stats) {
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-checked').textContent = stats.checkedIn;
            document.getElementById('stat-remaining').textContent = stats.notCheckedIn;
            document.getElementById('stat-invalid').textContent = stats.invalid;
            if (stats.eventCode) {
              document.getElementById('event-tag').textContent = stats.eventCode;
            }
          })
          .getTicketStats();
      }
    }

    // Auto-start on load
    window.addEventListener('load', () => {
      startScanner();
      loadStats();
    });
  </script>
</body>
</html>
